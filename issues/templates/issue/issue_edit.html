{% extends 'tickets/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Update ticket #{{ issue.pk }}: {{ issue.summary }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn btn-secondary" href="{% url 'issues:issue' issue.pk %}">Cancel</a>
</form>
{% endblock %}
